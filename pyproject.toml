[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logtriage"
version = "1.0.0"
description = "Offline triage for SSH auth logs and web access logs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "soc", "log-analysis", "incident-response", "detection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Operating System :: OS Independent",
]

[project.scripts]
logtriage = "logtriage.cli:main"

[tool.setuptools]
packages = ["logtriage", "logtriage.parsers", "logtriage.rules"]
